[pytest]
testpaths = tests
addopts = -v --tb=short -ra --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
markers =
    smoke: fast checks that the service is up and the happy paths work
    contract: response shape matches the spec (status, schema, types, enums, formats, headers)
    negative: invalid input is rejected the way the spec says
    boundary: values at and just outside documented limits
    security: authentication and authorisation
    integration: behaviour that spans both endpoints
